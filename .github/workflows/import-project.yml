name: Import project source

on:
  push:
    branches: [main]
    paths:
      - scam-message-analyzer.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified project archive
        run: |
          unzip -o scam-message-analyzer.zip
          rm scam-message-analyzer.zip
          rm .github/workflows/import-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete project source"
          git push
